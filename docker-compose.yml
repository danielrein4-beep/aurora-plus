services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: auroraplus_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env antes de levantar en producción}
    volumes:
      - aurora_db_data:/var/lib/postgresql/data
    # Sin mapeo de puertos al host a propósito: Postgres solo debe ser
    # alcanzable desde "app"/"backup" dentro de la red interna de Docker, no
    # desde internet. Para inspeccionar/migrar a mano usar
    # `docker compose exec db psql -U postgres -d auroraplus_db` en vez de
    # abrir el puerto — eso evita que cualquiera en internet pueda intentar
    # conectarse directo a la base.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/auroraplus_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env antes de levantar en producción}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env antes de levantar en producción}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Defina SUPER_ADMIN_PASSWORD en .env antes de levantar en producción}
      # En producción, definir FRONTEND_URL=https://{el mismo DOMAIN de abajo}
      # en el .env — de eso depende que el link del correo de "olvidé mi
      # clave" apunte al dominio real y no a localhost.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8443}
    # Tampoco se publica al host: todo el tráfico entra por Caddy (abajo),
    # que es quien habla HTTPS con el mundo exterior y reenvía internamente
    # a "app:8080". Antes esto estaba en "8080:8080", expuesto en plano.
    expose:
      - "8080"

  # Reverse proxy con HTTPS automático (Let's Encrypt) — es el único servicio
  # que recibe tráfico de internet (puertos 80/443). Caddy renueva los
  # certificados solo mientras DOMAIN apunte por DNS a este servidor; en local
  # (DOMAIN=localhost, el valor por defecto) sirve en HTTP plano sin intentar
  # pedir un certificado, porque "localhost" no es un dominio público.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Respaldo automático de la base — corre pg_dump periódicamente y guarda los
  # archivos en ./backups del HOST (no en un volumen interno de Docker), para
  # que sobrevivan a un `docker compose down -v` accidental y se puedan copiar
  # fuera del servidor (scp/rsync) para tener una copia offsite real.
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env antes de levantar en producción}
      DB_NAME: auroraplus_db
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
      - ./docker/backup/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

volumes:
  aurora_db_data:
  caddy_data:
  caddy_config:
