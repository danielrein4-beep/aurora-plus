# Perfil de test: base H2 en memoria (modo compatibilidad PostgreSQL) para que
# los tests de integracion no dependan de tener Postgres corriendo localmente.
# Se recrea desde cero en cada arranque de test (create-drop).
spring.datasource.url=jdbc:h2:mem:aurora_test_${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Pool mas grande que el default (10) para que la prueba de estres con varios
# tenants concurrentes ejercite concurrencia real en vez de solo hacer cola
# esperando conexion.
spring.datasource.hikari.maximum-pool-size=30

jwt.secret=clave-secreta-solo-para-tests-no-usar-en-produccion-1234567890
SUPER_ADMIN_USERNAME=test-admin
SUPER_ADMIN_PASSWORD=test-admin-123
