<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora+ | ERP</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="aurora-panel aurora-gradient-border" style="max-width: 480px; width: 100%; text-align: center;">
      <div style="margin-bottom: 1.5rem;">
        <img class="aurora-logo-animated" src="/img/aurora-logo.jpeg" alt="Logotipo Aurora+" width="96" height="96" style="border-radius: 20px; display: block; margin: 0 auto;">
      </div>

      <h1 class="aurora-gradient-text" style="font-size: 2rem; letter-spacing: 0.02em;">Aurora+</h1>
      <p class="aurora-text-secondary" style="margin-top: 0.25rem; margin-bottom: 1.5rem;">
        Sistema ERP unificado — Minero, Logística y Horeca
      </p>

      <p style="margin: 0;">Bienvenido al panel de verificación visual del sistema de diseño.</p>
      <p class="aurora-text-secondary" style="margin: 0.5rem 0 0 0; font-size: 0.9rem;">
        Paleta corporativa, tipografía e identidad de alta gama activas.
      </p>
    </div>
  </main>
</body>
</html>
