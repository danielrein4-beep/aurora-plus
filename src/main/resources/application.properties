spring.application.name=aurora-plus

# Configuración PostgreSQL — con valores por defecto para desarrollo local
# (sigue funcionando igual que antes sin tocar nada), pero override-ables por
# variable de entorno para Docker/Hetzner sin tocar este archivo ni el JAR.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auroraplus_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${SERVER_PORT:8080}

# OCR de facturas/tickets vía Gemini (core.ocr.FacturaOcrService y
# tamanacocomercial.TicketOcrService) — vacío por defecto: sin esta variable,
# esos endpoints responden 503 CONFIG_ERROR en vez de fallar el arranque.
gemini.api.key=${GEMINI_API_KEY:}

# Autenticacion (core.auth) - el valor por defecto de jwt.secret es SOLO para
# desarrollo local; DEBE cambiarse por una variable de entorno real en
# produccion (ver .env.example), o cualquiera podria firmar tokens validos.
jwt.secret=${JWT_SECRET:aurora-plus-desarrollo-local-clave-temporal-cambiar-en-produccion-1234567890}
jwt.expiracion-horas-tenant=${JWT_EXPIRACION_HORAS_TENANT:12}
jwt.expiracion-horas-super-admin=${JWT_EXPIRACION_HORAS_SUPER_ADMIN:8}

# Primer super-admin, sembrado al arrancar si no existe ninguno todavia (ver
# SuperAdminDataInitializer, que lee SUPER_ADMIN_USERNAME/SUPER_ADMIN_PASSWORD
# directo del entorno) - cambiar estos valores en produccion (ver .env.example).
