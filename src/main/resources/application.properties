spring.application.name=aurora-plus

# Configuración PostgreSQL — con valores por defecto para desarrollo local
# (sigue funcionando igual que antes sin tocar nada), pero override-ables por
# variable de entorno para Docker/Hetzner sin tocar este archivo ni el JAR.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auroraplus_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
# Antes: "update" — Hibernate improvisaba el esquema solo en cada arranque, sin
# ningún registro de qué cambió ni cuándo. "validate" no toca el esquema: solo
# confirma que coincide con las entidades, y falla el arranque si no — cualquier
# cambio real de esquema ahora es un script versionado en db/migration (ver
# db/migration/README.md), aplicado por Flyway ANTES de que Hibernate valide.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway parte del esquema QUE YA EXISTE en cada base (dev local, la del
# compañero de equipo, producción) como versión 1 — no reconstruye nada, solo
# empieza a registrar los cambios a partir de aquí. Ver db/migration/README.md
# para el procedimiento la primera vez que esto corre contra cada base.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema existente antes de Flyway

server.port=${SERVER_PORT:8080}

# Sin esto, Spring Boot rechaza cualquier archivo de más de 1MB y cualquier
# request de más de 10MB (default) — el portal público de recepción de
# laboratorio (PortalPacienteLaboratorioController) necesita aceptar varios
# PDFs/fotos por carga, "a veces más de 5", así que ambos límites se suben.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=100MB

# OCR de facturas/tickets vía Gemini (core.ocr.FacturaOcrService y
# tamanacocomercial.TicketOcrService) — vacío por defecto: sin esta variable,
# esos endpoints responden 503 CONFIG_ERROR en vez de fallar el arranque.
gemini.api.key=${GEMINI_API_KEY:}

# Autenticacion (core.auth) - el valor por defecto de jwt.secret es SOLO para
# desarrollo local; DEBE cambiarse por una variable de entorno real en
# produccion (ver .env.example), o cualquiera podria firmar tokens validos.
jwt.secret=${JWT_SECRET:aurora-plus-desarrollo-local-clave-temporal-cambiar-en-produccion-1234567890}
jwt.expiracion-horas-tenant=${JWT_EXPIRACION_HORAS_TENANT:12}
jwt.expiracion-horas-super-admin=${JWT_EXPIRACION_HORAS_SUPER_ADMIN:8}

# Primer super-admin, sembrado al arrancar si no existe ninguno todavia (ver
# SuperAdminDataInitializer, que lee SUPER_ADMIN_USERNAME/SUPER_ADMIN_PASSWORD
# directo del entorno) - cambiar estos valores en produccion (ver .env.example).

# URL base del frontend — se usa para armar enlaces dentro de correos (ej. recuperación de clave)
app.frontend.url=${FRONTEND_URL:http://localhost:8443}

# Configuración de Servidor de Correo (SMTP) para envío automático de Informes / Récipes
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
mail.from.address=${MAIL_FROM:notificaciones@auroraplus.app}
mail.from.name=${MAIL_FROM_NAME:MediClinic Pro}
